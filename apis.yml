aid: sphinx
name: Sphinx
description: >-
  Sphinx is an AI reliability and governance system for data and analytics that
  works to make AI-generated answers over enterprise data correct and auditable.
  Its tagline is "AI gets data wrong. Sphinx makes it right." The product pairs a
  data-science AI agent that lives in the code editor (a VS Code / Cursor
  extension, a command-line interface, and a Jupyter-native workflow) with a
  centralized, evolving knowledge base of business definitions and metrics,
  governance and role-based access controls, self-correcting accuracy that
  catches drift and hallucinations, and end-to-end auditability with full output
  lineage. Developers reach the platform through the Sphinx CLI (sphinx-ai-cli),
  the in-notebook Sphinx Library Python package (sphinxai) for LLM chat,
  embeddings, vision, and secure access to connections and secrets, and MCP for
  connecting external tools. Sphinx is SOC 2 Type 2 compliant with a zero data
  retention posture. The company raised a $9.5M seed round led by Lightspeed
  Venture Partners.
